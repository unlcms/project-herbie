label: 'Hero image object position'
description: 'The first percentage refers to the horizontal alignment of the object or image within its container. The second percentage controls the vertical alignment. For hero images, only changes to the vertical alignment typically have a visible effect. For example, setting it to 50% 100% would shift the image toward the bottom of the container. 50% 0% would move the image towards the top of its container.'
